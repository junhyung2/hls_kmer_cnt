# xrt.ini — kmer_count profiling for NDP acceleration research
# Vitis 2022.1 / XRT 2.13
# Place this file in the same directory as the host binary before running.
# Output files opened with: vitis_analyzer xrt.run_summary

[Debug]
# Native XRT API-level trace (host-side timeline: bo alloc, sync, kernel launch)
native_xrt_trace=true

# Low-overhead profiling (AP_CTRL register polls, CU start/end timestamps)
app_debug=false

[Runtime]
# Verbosity: 4 = INFO (shows HBM port mapping, bandwidth warnings)
verbosity=4

[Profile]
# ── Kernel execution ──────────────────────────────────────────────────────────
# Records CU start/end timestamps → compute utilization, kernel wall time
kernel_trace=true

# ── Stall analysis (most important for NDP optimization) ─────────────────────
# Captures per-CU stall cycles broken down into 3 types:
#   EXT : stalled waiting for external memory (HBM) — expected to be high for
#         hash_insert random RMW; target of cache/prefetch optimization
#   STR : stalled on HLS stream — parse_extract outrunning hash_insert means
#         stream back-pressure; hash_insert outrunning means stream underflow
#   INT : internal pipeline stall (loop-carried dependency, II > 1)
stall_trace=all

# ── Data transfer (PCIe host <-> device) ─────────────────────────────────────
# "fine" = per-transfer timestamps (FASTQ sync + HT init are the big ones)
# Reveals whether PCIe transfer dominates over kernel time
data_transfer_trace=fine

# ── Device-side memory profiling ─────────────────────────────────────────────
# Per-AXI-port read/write bandwidth and transaction counts
# Key question: are HBM[2:17] ports saturated during hash_insert?
device_profile=true

# ── Host-side API timeline ────────────────────────────────────────────────────
# XRT API calls (xrt::bo, sync, kernel::operator()) with durations
host_trace=true

# ── Summary report ───────────────────────────────────────────────────────────
# Writes profile_summary.csv — bandwidth table, CU utilization %, stall %
opencl_summary=true
