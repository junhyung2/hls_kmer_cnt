# HW target: 4 CUs, URAM-resident hash tables (NO T1/T2 in HBM)
#
# URAM layout per CU (HT_BITS=18, T_SIZE=131072 entries × 16 B = 2 MB per T):
#   T1: 64 URAMs  (32 row-groups × 2 cols for 128-bit entry)
#   T2: 64 URAMs
#   Per CU: 128 URAMs   Total: 512 / 640 URAMs (80%)
#
# HBM per CU (only k-mer input + control; no hash table BOs):
#   kmers  :  HBM[N]    up to ~240 MB (30M × 8 B)
#   seg_ends: HBM[N]    128 B  (16 × uint64_t)
#   n_unique: HBM[N]    8 B
#   → all three share one HBM channel; tiny seg_ends/n_unique cause no BW conflict
#
# HMSS connections: 3 × 4 = 12  (vs opt1: 16; no T1/T2 master ports)

[connectivity]
nk=kmer_count_sram:4

sp=kmer_count_sram_1.kmers:HBM[0]
sp=kmer_count_sram_1.seg_ends:HBM[0]
sp=kmer_count_sram_1.n_unique:HBM[0]

sp=kmer_count_sram_2.kmers:HBM[1]
sp=kmer_count_sram_2.seg_ends:HBM[1]
sp=kmer_count_sram_2.n_unique:HBM[1]

sp=kmer_count_sram_3.kmers:HBM[2]
sp=kmer_count_sram_3.seg_ends:HBM[2]
sp=kmer_count_sram_3.n_unique:HBM[2]

sp=kmer_count_sram_4.kmers:HBM[3]
sp=kmer_count_sram_4.seg_ends:HBM[3]
sp=kmer_count_sram_4.n_unique:HBM[3]
