# HW target: 4 CUs, HT_BITS=26 → T_SIZE=2^25=32M entries=512MB per T per CU
# Opt1: CPU pre-encoded k-mers (no seq1/seq2), on-device HT init (no HT PCIe transfer)
#
# kmers[CU]:  HBM[0..3]        one 256MB channel per CU (30M×8B=240MB fits)
# ht_t1[CU]:  HBM[4:5..18:19]  512MB per T per CU (2 channels)
# ht_t2[CU]:  adjacent 2 channels
# n_unique:   HBM[20]
#
# HMSS connections: 4+4+4+4 = 16 (well within 32 limit)

[connectivity]
nk=kmer_count_opt1:4

sp=kmer_count_opt1_1.kmers:HBM[0]
sp=kmer_count_opt1_2.kmers:HBM[1]
sp=kmer_count_opt1_3.kmers:HBM[2]
sp=kmer_count_opt1_4.kmers:HBM[3]

sp=kmer_count_opt1_1.ht_t1:HBM[4:5]
sp=kmer_count_opt1_1.ht_t2:HBM[6:7]
sp=kmer_count_opt1_2.ht_t1:HBM[8:9]
sp=kmer_count_opt1_2.ht_t2:HBM[10:11]
sp=kmer_count_opt1_3.ht_t1:HBM[12:13]
sp=kmer_count_opt1_3.ht_t2:HBM[14:15]
sp=kmer_count_opt1_4.ht_t1:HBM[16:17]
sp=kmer_count_opt1_4.ht_t2:HBM[18:19]

sp=kmer_count_opt1_1.n_unique:HBM[20]
sp=kmer_count_opt1_2.n_unique:HBM[20]
sp=kmer_count_opt1_3.n_unique:HBM[20]
sp=kmer_count_opt1_4.n_unique:HBM[20]
