# HW target: 4 CUs per card, URAM-resident hash tables (lazy-clear)
# Same per-card structure as 07_fpga_uram; host loads this xclbin on 3 cards.
#
# HBM per CU (k-mer input + seg_ends + n_unique only):
#   kmers    : HBM[N]  up to ~80 MB (10M × 8 B per CU on 3-card split)
#   seg_ends : HBM[N]  2048 B (256 × uint64_t)
#   n_unique : HBM[N]  8 B
#
# HMSS connections: 3 × 4 CU = 12

[connectivity]
nk=kmer_count_sram_opt1:4

sp=kmer_count_sram_opt1_1.kmers:HBM[0]
sp=kmer_count_sram_opt1_1.seg_ends:HBM[0]
sp=kmer_count_sram_opt1_1.n_unique:HBM[0]

sp=kmer_count_sram_opt1_2.kmers:HBM[1]
sp=kmer_count_sram_opt1_2.seg_ends:HBM[1]
sp=kmer_count_sram_opt1_2.n_unique:HBM[1]

sp=kmer_count_sram_opt1_3.kmers:HBM[2]
sp=kmer_count_sram_opt1_3.seg_ends:HBM[2]
sp=kmer_count_sram_opt1_3.n_unique:HBM[2]

sp=kmer_count_sram_opt1_4.kmers:HBM[3]
sp=kmer_count_sram_opt1_4.seg_ends:HBM[3]
sp=kmer_count_sram_opt1_4.n_unique:HBM[3]
