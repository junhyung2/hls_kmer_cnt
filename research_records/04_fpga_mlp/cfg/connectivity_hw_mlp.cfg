# HW target: 4 CUs, split HT into T1 and T2 (separate AXI masters per CU)
# HT_BITS=26 → T_SIZE=2^25=32M entries = 512MB per T per CU (needs 2 HBM channels each)
#
# seq1/seq2: shared read-only → HBM[0] / HBM[1]
# CU1: ht_t1 → HBM[2:3]    ht_t2 → HBM[4:5]
# CU2: ht_t1 → HBM[6:7]    ht_t2 → HBM[8:9]
# CU3: ht_t1 → HBM[10:11]  ht_t2 → HBM[12:13]
# CU4: ht_t1 → HBM[14:15]  ht_t2 → HBM[16:17]
# n_unique → HBM[18]
#
# HBM channels used: 19 of 32
# HMSS connections: 4+4+4+4+4 = 20 of 32 (safe margin)

[connectivity]
nk=kmer_count_mlp:4

sp=kmer_count_mlp_1.seq1:HBM[0]
sp=kmer_count_mlp_2.seq1:HBM[0]
sp=kmer_count_mlp_3.seq1:HBM[0]
sp=kmer_count_mlp_4.seq1:HBM[0]

sp=kmer_count_mlp_1.seq2:HBM[1]
sp=kmer_count_mlp_2.seq2:HBM[1]
sp=kmer_count_mlp_3.seq2:HBM[1]
sp=kmer_count_mlp_4.seq2:HBM[1]

sp=kmer_count_mlp_1.ht_t1:HBM[2:3]
sp=kmer_count_mlp_1.ht_t2:HBM[4:5]
sp=kmer_count_mlp_2.ht_t1:HBM[6:7]
sp=kmer_count_mlp_2.ht_t2:HBM[8:9]
sp=kmer_count_mlp_3.ht_t1:HBM[10:11]
sp=kmer_count_mlp_3.ht_t2:HBM[12:13]
sp=kmer_count_mlp_4.ht_t1:HBM[14:15]
sp=kmer_count_mlp_4.ht_t2:HBM[16:17]

sp=kmer_count_mlp_1.n_unique:HBM[18]
sp=kmer_count_mlp_2.n_unique:HBM[18]
sp=kmer_count_mlp_3.n_unique:HBM[18]
sp=kmer_count_mlp_4.n_unique:HBM[18]
