# HW target: 4 CUs, HT = 2^26 = 64M entries = 1GB per CU (4 HBM PCs each)
# seq1/seq2 shared (read-only): HBM[0]/HBM[1]
# per-CU ht: HBM[2:5], HBM[6:9], HBM[10:13], HBM[14:17]
# per-CU n_unique: HBM[18]

[connectivity]
nk=kmer_count_opt:4

# seq1: all CUs read from HBM[0]
sp=kmer_count_opt_1.seq1:HBM[0]
sp=kmer_count_opt_2.seq1:HBM[0]
sp=kmer_count_opt_3.seq1:HBM[0]
sp=kmer_count_opt_4.seq1:HBM[0]

# seq2: all CUs read from HBM[1]
sp=kmer_count_opt_1.seq2:HBM[1]
sp=kmer_count_opt_2.seq2:HBM[1]
sp=kmer_count_opt_3.seq2:HBM[1]
sp=kmer_count_opt_4.seq2:HBM[1]

# ht: 4 HBM PCs per CU (interleaved)
sp=kmer_count_opt_1.ht:HBM[2:5]
sp=kmer_count_opt_2.ht:HBM[6:9]
sp=kmer_count_opt_3.ht:HBM[10:13]
sp=kmer_count_opt_4.ht:HBM[14:17]

# n_unique
sp=kmer_count_opt_1.n_unique:HBM[18]
sp=kmer_count_opt_2.n_unique:HBM[18]
sp=kmer_count_opt_3.n_unique:HBM[18]
sp=kmer_count_opt_4.n_unique:HBM[18]

[profile]
data=kmer_count_opt:kmer_count_opt_1:seq1
data=kmer_count_opt:kmer_count_opt_1:seq2
data=kmer_count_opt:kmer_count_opt_1:ht
stall=kmer_count_opt:kmer_count_opt_1
