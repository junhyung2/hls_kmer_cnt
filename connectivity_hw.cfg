# HW target: HT = 2^28 = 268 M entries = 4 GB → 16 HBM PCs [2:17]
# Input FASTQ: HBM[0] (seq1, 200 MB) + HBM[1] (seq2, 200 MB)
# Hash table : HBM[2:17] (16 x 256 MB = 4 GB)
# n_unique   : HBM[18]
[connectivity]
nk=kmer_count:1:kmer_count_1
sp=kmer_count_1.seq1:HBM[0]
sp=kmer_count_1.seq2:HBM[1]
sp=kmer_count_1.ht:HBM[2:17]
sp=kmer_count_1.n_unique:HBM[18]

[profile]
data=kmer_count:kmer_count_1:seq1
data=kmer_count:kmer_count_1:seq2
data=kmer_count:kmer_count_1:ht
stall=kmer_count:kmer_count_1
